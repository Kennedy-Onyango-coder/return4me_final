name: Prepare dependency lock

on:
  push:
    branches:
      - fix/requirement-register-reconciliation
    paths:
      - package.json
      - .github/workflows/prepare-dependency-lock.yml

permissions:
  contents: write

concurrency:
  group: prepare-dependency-lock
  cancel-in-progress: false

jobs:
  lock-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/requirement-register-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from reviewed dependency policy
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci
      - name: Enforce dependency audit
        run: npm audit --audit-level=high
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Run test suite
        run: npm test -- --run
      - name: Build production artifacts
        run: npm run build
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate audited dependency lockfile"
          git push origin HEAD:fix/requirement-register-reconciliation
